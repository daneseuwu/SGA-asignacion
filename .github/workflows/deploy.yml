name: Deploy Spring Boot to AWS

on:
  push:
    branches: [ develop-features ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Get or Create EC2 Instance
        id: ec2
        run: |
          # Buscar instancia existente por tag
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=springboot-app" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)
          
          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "⚠️ No se encontró instancia existente. Creando nueva..."
          
            # Crear security group si no existe
            SG_ID=$(aws ec2 describe-security-groups \
              --filters "Name=group-name,Values=springboot-sg" \
              --query 'SecurityGroups[0].GroupId' \
              --output text 2>/dev/null || echo "None")
          
            if [ "$SG_ID" = "None" ]; then
              SG_ID=$(aws ec2 create-security-group \
                --group-name springboot-sg \
                --description "Spring Boot security group" \
                --query 'GroupId' \
                --output text)
          
              # Permitir SSH
              aws ec2 authorize-security-group-ingress \
                --group-id $SG_ID \
                --protocol tcp --port 22 --cidr 0.0.0.0/0
          
              # Permitir puerto 8080
              aws ec2 authorize-security-group-ingress \
                --group-id $SG_ID \
                --protocol tcp --port 8080 --cidr 0.0.0.0/0
            fi
          
            # Usar key pair existente o crear uno nuevo
            KEY_NAME="${{ secrets.KEY_PAIR_NAME }}"
            if [ -z "$KEY_NAME" ]; then
              KEY_NAME="springboot-key"
              # Crear key pair si no existe
              aws ec2 describe-key-pairs --key-names $KEY_NAME 2>/dev/null || \
                aws ec2 import-key-pair \
                  --key-name $KEY_NAME \
                  --public-key-material fileb://<(echo "${{ secrets.SSH_PUBLIC_KEY }}")
            fi
          
            # Obtener AMI de Ubuntu más reciente
            AMI_ID=$(aws ec2 describe-images \
              --owners 099720109477 \
              --filters "Name=name,Values=ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*" \
              --query 'Images | sort_by(@, &CreationDate) | [-1].ImageId' \
              --output text)
          
            # Crear instancia
            INSTANCE_ID=$(aws ec2 run-instances \
              --image-id $AMI_ID \
              --instance-type t3.small \
              --key-name ${KEY_NAME:-springboot-key} \
              --security-group-ids $SG_ID \
              --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=springboot-app}]' \
              --user-data '#!/bin/bash
                apt-get update
                apt-get install -y openjdk-17-jre-headless
          
                cat > /etc/systemd/system/springboot.service << "EOF"
                [Unit]
                Description=Spring Boot Application
                After=network.target
          
                [Service]
                Type=simple
                User=ubuntu
                WorkingDirectory=/home/ubuntu
                ExecStart=/usr/bin/java -jar /home/ubuntu/app.jar
                Restart=always
                RestartSec=10
          
                [Install]
                WantedBy=multi-user.target
                EOF
          
                systemctl daemon-reload
                systemctl enable springboot
              ' \
              --query 'Instances[0].InstanceId' \
              --output text)
          
            echo "Esperando que la instancia esté lista..."
            aws ec2 wait instance-running --instance-ids $INSTANCE_ID
            sleep 30
          else
            echo "✅ Instancia existente encontrada: $INSTANCE_ID"
            echo "Reutilizando instancia..."
          fi
          
          # Obtener IP pública
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "Instancia: $INSTANCE_ID - IP: $PUBLIC_IP"

      - name: Deploy Application
        env:
          HOST: ${{ steps.ec2.outputs.public_ip }}
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          
          # Esperar a que SSH esté disponible
          for i in {1..30}; do
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
              -i private_key.pem ubuntu@${HOST} "echo 'SSH ready'" && break
            echo "Esperando SSH... intento $i"
            sleep 10
          done
          
          # Copiar JAR
          scp -o StrictHostKeyChecking=no -i private_key.pem \
            target/*.jar ubuntu@${HOST}:/home/ubuntu/app.jar
          
          # Reiniciar aplicación
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@${HOST} << 'EOF'
            sudo systemctl stop springboot || true
            sudo systemctl start springboot
            sleep 5
            sudo systemctl status springboot
          EOF
          
          rm -f private_key.pem
          
          echo "✅ Aplicación desplegada en http://${HOST}:8080"